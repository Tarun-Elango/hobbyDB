# kvStore settings (read at startup by package config; no defaults, every key is required)
# Durations are in milliseconds, sizes are in bytes.

# A. Protocol / WAL limits (proto/wire.go, wal/record.go)
proto.max.key.len=65535
proto.max.value.len=16777216

# B. Server (server/server.go)
server.raft.propose.timeout.ms=5000
# Where GET and LEN may be answered: "any" = the node the client is connected to
# (can be stale on a follower), "leader" = followers answer NotLeader and the
# client redirects to the leader, like a write.
server.read.from=any

# C. Raft election (raft/election.go)
raft.election.timeout.min.ms=150
raft.election.timeout.max.ms=300

# D. Raft log replication (raft/replicate.go)
raft.append.entries.batch.limit=64
raft.append.entries.max.payload=67108862
raft.append.retry.backoff.ms=50

# E. Raft persistent state (raft/state_record.go)
raft.max.voted.for.len=256

# F. Replication transport (replication/transport.go)
replication.rpc.attempt.timeout.ms=80
replication.rpc.attempts=3

# G. Replication leader (replication/leader.go)
replication.batch.size=64
replication.retry.backoff.initial.ms=50
replication.retry.backoff.max.ms=2000
replication.rpc.timeout.ms=5000

# H. Replication wire limits (replication/wire.go, encode_decode.go)
replication.max.frame=67108864
replication.max.leader.id.len=256
replication.max.error.message.len=65536
replication.max.entries.per.request=1024

# I. Client (client/main.go)
client.redirect.pause.ms=100
client.retry.window.ms=5000
client.dial.timeout.ms=1000
